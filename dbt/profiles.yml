# -----------------------------------------------------------------------------
# NOT used by dbt Cloud (connections are configured per environment in the UI).
#   databricks : local development with dbt Core / VS Code against a dev catalog
#   ci         : DuckDB, used by GitHub Actions to build and test the full DAG on
#                synthetic data without cloud credentials
# All secrets come from environment variables.
# -----------------------------------------------------------------------------
telecare:
  target: "{{ env_var('DBT_TARGET', 'ci') }}"
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: "{{ env_var('DBT_TARGET_CATALOG', 'telecare_dev') }}"
      schema: "{{ env_var('DBT_DEV_SCHEMA', 'dbt_' ~ env_var('USER', 'dev')) }}"
      threads: 8

    ci:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', '../work/telecare_ci.duckdb') }}"
      schema: ci
      threads: 4
      settings:
        TimeZone: UTC
